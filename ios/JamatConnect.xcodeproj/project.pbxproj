		0C3D814B090B59D1D100F129 /* [RNFB] Embed Firebase SPM Frameworks */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
